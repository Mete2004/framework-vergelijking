{# Header uit SnappThis (organisms/Header.svelte). De parameters zijn de props van het Svelte-component. #}
{% macro header(title='', showBackButton=false, backUrl='/') %}
<header class="top-nav">
    {% if showBackButton %}
        <!-- Back navigation -->
        <a href="{{ backUrl }}" class="go-back-link" aria-label="Go back">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <title>Go back</title>
                <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M7.6 14L18.8 2.8L16 0L0 16L16 32L18.8 29.2L7.6 18H32V14H7.6Z"
                />
            </svg>
        </a>
    {% endif %}

    <h1 class="title">{{ title }}</h1>
</header>
{% endmacro %}
